<!DOCTYPE html>
<html lang="zh-CN" data-palette="indigo">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dev Toolbox · 设计稿 v2（可交互）</title>
<style>
/* =====================================================================
   设计令牌：与项目 style.css 保持一致（色板 × 明暗）
   ===================================================================== */
:root{
  --nh:225;--ph:239;--ps:84%;--pl:60%;--psd:92%;--pld:76%;
  --background:var(--nh) 25% 97.5%;--foreground:var(--nh) 30% 10%;
  --card:0 0% 100%;--popover:0 0% 100%;
  --primary:var(--ph) var(--ps) var(--pl);--primary-fg:0 0% 100%;
  --muted:var(--nh) 20% 94.5%;--muted-fg:var(--nh) 9% 42%;
  --border:var(--nh) 18% 90%;
  --success:152 62% 36%;--danger:0 78% 56%;--warn:36 92% 46%;
  --add:152 60% 40%;--del:0 75% 55%;
  --shadow-pop:0 12px 32px -10px hsl(var(--nh) 40% 10%/.28),0 2px 8px -2px hsl(var(--nh) 40% 10%/.12);
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --fast:120ms;--base:180ms;--slow:280ms;
  --rail:48px;--bar:36px;--status:24px;--radius:8px;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
.dark{
  --background:var(--nh) 26% 6.5%;--foreground:var(--nh) 25% 94%;
  --card:var(--nh) 24% 9%;--popover:var(--nh) 24% 10.5%;
  --primary:var(--ph) var(--psd) var(--pld);--primary-fg:var(--nh) 40% 8%;
  --muted:var(--nh) 18% 13.5%;--muted-fg:var(--nh) 12% 63%;
  --border:var(--nh) 16% 17%;
  --success:152 55% 50%;--danger:0 70% 60%;--warn:38 92% 58%;
  --add:152 55% 50%;--del:0 70% 60%;
  --shadow-pop:0 16px 44px -12px hsl(0 0% 0%/.75),0 2px 10px -2px hsl(0 0% 0%/.5);
  color-scheme:dark;
}
[data-palette=emerald]{--nh:160;--ph:160;--ps:84%;--pl:32%;--psd:62%;--pld:52%}
[data-palette=rose]{--nh:345;--ph:346;--ps:77%;--pl:50%;--psd:90%;--pld:68%}
[data-palette=amber]{--nh:35;--ph:32;--ps:95%;--pl:44%;--psd:92%;--pld:56%}
[data-palette=ocean]{--nh:205;--ph:199;--ps:89%;--pl:40%;--psd:92%;--pld:56%}
[data-palette=graphite]{--nh:240;--ph:240;--ps:6%;--pl:16%;--psd:8%;--pld:92%}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.45 var(--sans);background:hsl(var(--background));color:hsl(var(--foreground));-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
kbd{font:11px/1 var(--mono);padding:2px 5px;border:1px solid hsl(var(--border));border-bottom-width:2px;border-radius:4px;background:hsl(var(--muted));color:hsl(var(--muted-fg))}
:focus-visible{outline:2px solid hsl(var(--primary)/.7);outline-offset:1px;border-radius:4px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:hsl(var(--muted-fg)/.25);border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:hsl(var(--muted-fg)/.45);background-clip:content-box}

/* ============ 外壳：图标轨道 + 内容 ============ */
.app{position:fixed;inset:0;display:flex}
.rail-wrap{width:var(--rail);flex-shrink:0;position:relative;z-index:30;transition:width var(--slow) var(--ease)}
.rail-wrap.docked{width:200px}
/* 轨道本体：悬停时向右展开，覆盖内容而不挤压内容（零重排） */
.rail{position:absolute;inset:0 auto 0 0;width:var(--rail);background:hsl(var(--card));border-right:1px solid hsl(var(--border));display:flex;flex-direction:column;padding:6px 6px;gap:2px;overflow:hidden;transition:width var(--slow) var(--ease),box-shadow var(--slow)}
.rail-wrap.docked .rail,.rail-wrap:not(.docked) .rail:hover{width:200px}
.rail-wrap:not(.docked) .rail:hover{box-shadow:var(--shadow-pop)}
.brand{display:flex;align-items:center;gap:10px;height:30px;padding:0 5px;margin-bottom:4px}
.logo{width:22px;height:22px;border-radius:6px;background:hsl(var(--primary));color:hsl(var(--primary-fg));display:grid;place-items:center;flex-shrink:0}
.logo svg{width:13px;height:13px}
.lbl{white-space:nowrap;opacity:0;transform:translateX(-4px);transition:opacity var(--base),transform var(--base) var(--ease)}
.rail:hover .lbl,.docked .lbl{opacity:1;transform:none;transition-delay:60ms}
.brand b{font-weight:650;letter-spacing:-.01em}
.nav{position:relative;display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:7px;color:hsl(var(--muted-fg));font-weight:500;width:100%;text-align:left;transition:background var(--fast),color var(--fast)}
.nav:hover{background:hsl(var(--muted));color:hsl(var(--foreground))}
.nav.on{color:hsl(var(--primary))}
.nav .ln{margin-left:auto;font:10px var(--mono);opacity:.5}
.nav.off{opacity:.45}
.ind{position:absolute;left:6px;width:calc(100% - 12px);height:32px;border-radius:7px;background:hsl(var(--primary)/.12);transform:translateY(var(--y,0));transition:transform var(--slow) var(--spring);pointer-events:none;z-index:0}
.ind::before{content:"";position:absolute;left:-6px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:hsl(var(--primary))}
.nav>*{position:relative;z-index:1}
.sep{height:1px;background:hsl(var(--border));margin:6px 4px}
.grow{flex:1}

/* ============ 主区域 ============ */
.main{flex:1;min-width:0;position:relative}
.tool{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transform:translateY(6px);visibility:hidden;pointer-events:none;
  transition:opacity var(--base) var(--ease),transform var(--base) var(--ease),visibility 0s linear var(--base)}
.tool.on{opacity:1;transform:none;visibility:visible;pointer-events:auto;transition-delay:0s}

/* 命令栏：每个工具只有一行 36px，主操作 + 选项 + 溢出 */
.bar{height:var(--bar);flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 8px;border-bottom:1px solid hsl(var(--border));background:hsl(var(--card))}
.title{display:flex;align-items:center;gap:7px;font-weight:650;color:hsl(var(--primary));padding-right:2px;white-space:nowrap}
.vr{width:1px;height:16px;background:hsl(var(--border));flex-shrink:0}
.sp{flex:1;min-width:0}
.seg{position:relative;display:inline-flex;padding:2px;background:hsl(var(--muted));border-radius:8px;flex-shrink:0}
.seg button{position:relative;z-index:1;height:24px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:500;color:hsl(var(--muted-fg));display:inline-flex;align-items:center;gap:5px;transition:color var(--base)}
.seg button.on{color:hsl(var(--foreground))}
.seg button svg{width:13px;height:13px}
.seg i{position:absolute;top:2px;bottom:2px;left:0;border-radius:6px;background:hsl(var(--card));box-shadow:0 1px 2px hsl(0 0% 0%/.12),0 0 0 1px hsl(var(--border));transform:translateX(var(--x,0));width:var(--w,0);transition:transform var(--slow) var(--spring),width var(--slow) var(--ease)}
.chip{height:24px;padding:0 9px;border-radius:6px;border:1px solid hsl(var(--border));font-size:12px;font-weight:500;color:hsl(var(--muted-fg));display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:all var(--fast) var(--ease)}
.chip:hover{background:hsl(var(--muted));color:hsl(var(--foreground))}
.chip.on{background:hsl(var(--primary)/.1);border-color:hsl(var(--primary)/.45);color:hsl(var(--primary))}
.chip:active,.ib:active,.seg button:active{transform:scale(.95)}
.ib{width:26px;height:26px;border-radius:6px;display:inline-grid;place-items:center;color:hsl(var(--muted-fg));transition:all var(--fast) var(--ease);position:relative}
.ib:hover{background:hsl(var(--muted));color:hsl(var(--foreground))}
.ib[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:hsl(var(--foreground));color:hsl(var(--background));font-size:11px;padding:3px 7px;border-radius:5px;z-index:60;pointer-events:none;animation:tip .14s var(--ease) .35s both}
@keyframes tip{from{opacity:0;transform:translate(-50%,-3px)}to{opacity:1;transform:translate(-50%,0)}}
.cmdk{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 6px 0 8px;border-radius:6px;border:1px solid hsl(var(--border));color:hsl(var(--muted-fg));font-size:12px;transition:all var(--fast)}
.cmdk:hover{background:hsl(var(--muted));color:hsl(var(--foreground))}

/* 下拉菜单（通用） */
.dd{position:relative;display:inline-flex}
.menu{position:absolute;top:calc(100% + 6px);right:0;min-width:190px;background:hsl(var(--popover));border:1px solid hsl(var(--border));border-radius:10px;box-shadow:var(--shadow-pop);padding:4px;z-index:50;opacity:0;transform:translateY(-4px) scale(.97);transform-origin:top right;visibility:hidden;transition:opacity var(--base) var(--ease),transform var(--slow) var(--spring),visibility 0s linear var(--base)}
.menu.left{right:auto;left:0;transform-origin:top left}
.dd.open .menu{opacity:1;transform:none;visibility:visible;transition-delay:0s}
.mi{display:flex;align-items:center;gap:8px;width:100%;height:28px;white-space:nowrap;padding:0 8px;border-radius:6px;font-size:12.5px;text-align:left;color:hsl(var(--foreground)/.85)}
.mi:hover{background:hsl(var(--muted))}
.mi .k{margin-left:auto;font:11px var(--mono);color:hsl(var(--muted-fg))}
.mi.sel{color:hsl(var(--primary))}
.mi .ck{margin-left:auto;width:13px;height:13px;opacity:0}.mi.sel .ck{opacity:1}
.mh{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:hsl(var(--muted-fg));padding:6px 8px 3px}

/* 工作区：可拖拽分栏 */
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,var(--split,50%)) 5px minmax(0,1fr);padding:8px 8px 0 8px}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius);overflow:hidden}
.gut-h{cursor:col-resize;position:relative}
.gut-h::after{content:"";position:absolute;inset:0 1px;border-radius:3px;background:hsl(var(--primary));opacity:0;transition:opacity var(--base)}
.gut-h:hover::after,.gut-h.drag::after{opacity:.55}
.ph{height:26px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 4px 0 10px;border-bottom:1px solid hsl(var(--border));background:hsl(var(--muted)/.45);font-size:11.5px;color:hsl(var(--muted-fg));font-weight:500}
.ph .ib{width:22px;height:22px}.ph .ib svg{width:13px;height:13px}
.badge{font:10.5px var(--mono);padding:1px 6px;border-radius:9px;background:hsl(var(--muted));color:hsl(var(--muted-fg))}
.badge.add{background:hsl(var(--add)/.14);color:hsl(var(--add))}.badge.del{background:hsl(var(--del)/.14);color:hsl(var(--del))}
.pbody{flex:1;min-height:0;position:relative}
.pview{position:absolute;inset:0;opacity:0;transform:translateY(5px);visibility:hidden;transition:opacity var(--base) var(--ease),transform var(--base) var(--ease),visibility 0s linear var(--base);overflow:auto}
.pview.on{opacity:1;transform:none;visibility:visible;transition-delay:0s}

/* 迷你编辑器：高亮层 + 行号 + 透明 textarea */
.ed{position:absolute;inset:0;overflow:auto;display:grid;grid-template-columns:auto minmax(0,1fr);font:12.5px/20px var(--mono);tab-size:2}
.gut{position:sticky;left:0;z-index:2;min-width:38px;padding:8px 8px 8px 0;text-align:right;color:hsl(var(--muted-fg)/.6);background:hsl(var(--card));user-select:none}
.gut div{height:20px}.gut .cur{color:hsl(var(--foreground))}
.gut .gd{color:hsl(var(--del))}.gut .ga{color:hsl(var(--add))}
.code{position:relative;padding:8px 14px 8px 8px;min-width:100%}
.code pre{font:inherit;white-space:pre;min-height:100%;pointer-events:none}
.code pre .l{display:block;height:20px;margin:0 -14px 0 -8px;padding:0 14px 0 8px;transition:background var(--base)}
.code textarea{position:absolute;inset:8px 14px 8px 8px;width:calc(100% - 22px);height:calc(100% - 16px);font:inherit;color:transparent;caret-color:hsl(var(--foreground));background:transparent;border:0;outline:0;resize:none;white-space:pre;overflow:hidden;tab-size:2}
.code textarea::selection{background:hsl(var(--primary)/.28);color:transparent}
.l.del{background:hsl(var(--del)/.13)}.l.add{background:hsl(var(--add)/.14)}
.l.err{background:hsl(var(--danger)/.14);box-shadow:inset 3px 0 hsl(var(--danger))}
.l.flash{animation:flash 1s var(--ease)}
@keyframes flash{0%,40%{background:hsl(var(--warn)/.35)}}
/* 语法色 */
.k{color:hsl(var(--ph) 70% 50%);font-weight:600}.dark .k{color:hsl(var(--ph) 85% 74%)}
.s{color:hsl(152 55% 32%)}.dark .s{color:hsl(152 50% 66%)}
.n{color:hsl(28 85% 42%)}.dark .n{color:hsl(32 90% 68%)}
.b{color:hsl(280 55% 48%)}.dark .b{color:hsl(280 70% 76%)}
.c{color:hsl(var(--muted-fg));font-style:italic}
.p{color:hsl(var(--muted-fg))}
.f{color:hsl(210 70% 42%)}.dark .f{color:hsl(210 85% 72%)}

/* 树视图：grid-template-rows 0fr→1fr 实现无需测量高度的丝滑折叠 */
.tree{padding:6px 8px;font:12.5px/22px var(--mono)}
.tn>.row{display:flex;align-items:center;gap:2px;border-radius:5px;padding-right:8px;cursor:default}
.tn>.row:hover{background:hsl(var(--muted))}
.caret{width:16px;height:22px;display:grid;place-items:center;color:hsl(var(--muted-fg));transition:transform var(--base) var(--ease);cursor:pointer;flex-shrink:0}
.caret svg{width:11px;height:11px}.tn.open>.row>.caret{transform:rotate(90deg)}
.tn .key{color:hsl(var(--ph) 70% 50%);cursor:pointer}.dark .tn .key{color:hsl(var(--ph) 85% 74%)}
.tn .key:hover{text-decoration:underline}
.sum{color:hsl(var(--muted-fg));margin-left:6px;font-size:11px}
.kids{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--slow) var(--ease);margin-left:9px;border-left:1px solid hsl(var(--border))}
.tn.open>.kids{grid-template-rows:1fr}.kids>div{overflow:hidden;padding-left:6px}
.tbl{width:100%;border-collapse:collapse;font:12.5px var(--mono)}
.tbl th{position:sticky;top:0;background:hsl(var(--muted));text-align:left;padding:5px 10px;font:600 11px var(--sans);color:hsl(var(--muted-fg));border-bottom:1px solid hsl(var(--border))}
.tbl td{padding:4px 10px;border-bottom:1px solid hsl(var(--border)/.6)}
.tbl tr:hover td{background:hsl(var(--muted)/.6)}
.pane.stale .pbody,.pane.stale .qbar{opacity:.38;filter:saturate(.4)}.pane .pbody,.pane .qbar{transition:opacity var(--slow) var(--ease),filter var(--slow) var(--ease)}
.empty{height:100%;display:grid;place-items:center;color:hsl(var(--muted-fg));text-align:center;padding:20px}

/* 查询条 */
.qbar{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-bottom:1px solid hsl(var(--border));color:hsl(var(--muted-fg))}
.qbar input{flex:1;min-width:0;background:none;border:0;outline:0;font:12.5px var(--mono);color:hsl(var(--foreground))}
.qbar input::placeholder{color:hsl(var(--muted-fg)/.7)}
.qres{font:11px var(--mono);padding:1px 7px;border-radius:9px;background:hsl(var(--muted));white-space:nowrap}
.qres.ok{background:hsl(var(--success)/.14);color:hsl(var(--success))}.qres.no{background:hsl(var(--danger)/.12);color:hsl(var(--danger))}

/* 状态栏：报错/统计都在这里，永不顶开布局 */
.status{height:var(--status);flex-shrink:0;margin-top:8px;display:flex;align-items:center;gap:14px;padding:0 12px;border-top:1px solid hsl(var(--border));background:hsl(var(--card));font-size:11.5px;color:hsl(var(--muted-fg));white-space:nowrap;overflow:hidden;transition:background var(--base),color var(--base)}
.status .ok{color:hsl(var(--success));display:flex;align-items:center;gap:5px;font-weight:500}
.status.bad{background:hsl(var(--danger)/.1)}
.status .err{color:hsl(var(--danger));display:flex;align-items:center;gap:5px;font-weight:500;cursor:pointer}
.status .err:hover{text-decoration:underline}
.status svg{width:13px;height:13px}.status .r{margin-left:auto;display:flex;gap:14px}

/* 命令面板 */
.ov{position:fixed;inset:0;z-index:90;background:hsl(var(--background)/.7);display:flex;justify-content:center;padding-top:13vh;opacity:0;visibility:hidden;transition:opacity var(--base),visibility 0s linear var(--base)}
.ov.on{opacity:1;visibility:visible;transition-delay:0s}
.dlg{width:min(560px,calc(100% - 24px));max-height:60vh;display:flex;flex-direction:column;background:hsl(var(--popover));border:1px solid hsl(var(--border));border-radius:12px;box-shadow:var(--shadow-pop);overflow:hidden;transform:translateY(10px) scale(.97);transition:transform var(--slow) var(--spring);align-self:flex-start}
.ov.on .dlg{transform:none}
.dlg input{height:44px;padding:0 14px;border:0;outline:0;background:none;font:14px var(--sans);color:inherit;border-bottom:1px solid hsl(var(--border))}
.dlg .list{overflow:auto;padding:5px}
.dlg .mi{height:34px}.dlg .mi.act{background:hsl(var(--primary)/.1);color:hsl(var(--primary))}
.sw{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px hsl(0 0% 0%/.15)}
.toast{position:fixed;left:50%;bottom:40px;z-index:99;transform:translate(-50%,14px) scale(.96);opacity:0;background:hsl(var(--foreground));color:hsl(var(--background));padding:7px 14px;border-radius:9px;font-size:12.5px;box-shadow:var(--shadow-pop);transition:opacity var(--base),transform var(--slow) var(--spring);pointer-events:none;display:flex;gap:7px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hint{position:fixed;right:12px;bottom:34px;z-index:20;font-size:11px;color:hsl(var(--muted-fg));background:hsl(var(--card));border:1px solid hsl(var(--border));padding:4px 9px;border-radius:8px;opacity:.9}

/* 窄屏：轨道只留图标，分栏上下堆叠 */
@media (max-width:860px){
  .work{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(0,1fr) 5px minmax(0,1fr)}
  .gut-h{cursor:default}.hide-s{display:none!important}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<!-- 图标库 -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-json" viewBox="0 0 24 24"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1M16 21h1a2 2 0 0 0 2-2v-5a2 2 0 0 1 2-2 2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/></symbol>

<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>

<script>
/* =====================================================================
   工具函数
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ic=(n,s)=>`<svg${s?` style="width:${s}px;height:${s}px"`:''}><use href="#i-${n}"/></svg>`;
let toastT; function toast(msg){const t=$('#toast');t.innerHTML=ic('check',14)+esc(msg);t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1600)}
function copy(txt,msg){navigator.clipboard?.writeText(txt).catch(()=>{});toast(msg||'已复制')}
const bytes=n=>n<1024?n+' B':(n/1024).toFixed(1)+' KB';

/* 分段控件：滑块用 transform 平移，弹性曲线 */
function seg(el,cb){
  const ind=$('i',el), btns=$$('button',el);
  const place=()=>{const b=$('button.on',el);if(!b||!b.offsetWidth)return;el.style.setProperty('--x',b.offsetLeft-2+'px');el.style.setProperty('--w',b.offsetWidth+'px');ind.style.transform='';}
  btns.forEach(b=>b.addEventListener('click',()=>{btns.forEach(x=>x.classList.toggle('on',x===b));place();cb&&cb(b.dataset.v,b)}));
  el._place=place; place(); return {set(v){const b=btns.find(x=>x.dataset.v===v);b&&b.click()},get:()=>$('button.on',el).dataset.v}
}
/* 下拉菜单 */
function dropdown(dd,items,{value,onPick,btn,label}={}){
  const menu=$('.menu',dd); let cur=value;
  const render=()=>{menu.innerHTML=items.map(i=>i.h?`<div class="mh">${i.h}</div>`:`<button class="mi${i.v===cur?' sel':''}" data-v="${i.v}">${i.sw?`<span class="sw" style="background:${i.sw}"></span>`:''}${i.l}${i.k?`<span class="k">${i.k}</span>`:`<svg class="ck">${'<use href="#i-check"/>'}</svg>`}</button>`).join('')};
  render();
  menu.addEventListener('click',e=>{const b=e.target.closest('.mi');if(!b)return;cur=b.dataset.v;render();dd.classList.remove('open');onPick&&onPick(cur,items.find(i=>i.v===cur))});
  if(btn)btn.addEventListener('click',e=>{e.stopPropagation();const o=dd.classList.contains('open');$$('.dd.open').forEach(x=>x.classList.remove('open'));dd.classList.toggle('open',!o)});
  return {set:v=>{cur=v;render()}}
}
document.addEventListener('click',()=>$$('.dd.open').forEach(x=>x.classList.remove('open')));

/* 分栏拖拽：双击恢复 50% */
$$('[data-gut]').forEach(g=>{const w=g.parentElement;
  g.addEventListener('mousedown',e=>{e.preventDefault();g.classList.add('drag');document.body.style.cursor='col-resize';
    const r=w.getBoundingClientRect(),mv=ev=>{w.style.setProperty('--split',Math.max(18,Math.min(82,(ev.clientX-r.left-8)/(r.width-16)*100))+'%')},
    up=()=>{g.classList.remove('drag');document.body.style.cursor='';removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};
    addEventListener('mousemove',mv);addEventListener('mouseup',up)});
  g.addEventListener('dblclick',()=>w.style.setProperty('--split','50%'));
});

/* =====================================================================
   语法高亮
   ===================================================================== */
function hlJSON(line){
  return esc(line).replace(/(&quot;|")((?:\\.|[^"\\])*)"(\s*:)?|\b(true|false|null)\b|-?\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b|[{}\[\],:]/g,(m,q,body,colon,kw)=>{
    if(q!==undefined)return colon?`<span class="k">"${body}"</span>${colon.replace(':','<span class="p">:</span>')}`:`<span class="s">"${body}"</span>`;
    if(kw)return `<span class="b">${kw}</span>`; if(/^[{}\[\],:]$/.test(m))return `<span class="p">${m}</span>`; return `<span class="n">${m}</span>`});
}
const KW='SELECT|FROM|WHERE|GROUP BY|ORDER BY|HAVING|LIMIT|OFFSET|LEFT JOIN|RIGHT JOIN|INNER JOIN|FULL JOIN|JOIN|ON|AND|OR|NOT|IN|IS|NULL|AS|DESC|ASC|DISTINCT|UNION ALL|UNION|INSERT INTO|VALUES|UPDATE|SET|DELETE|CREATE TABLE|CASE|WHEN|THEN|ELSE|END|LIKE|BETWEEN|EXISTS|COUNT|SUM|AVG|MAX|MIN|COALESCE|NOW';
const KWRE=new RegExp('\\b('+KW+')\\b','gi');
function hlSQL(line){
  return esc(line).replace(/(--.*$)|('(?:''|[^'])*')|\b(\d+(?:\.\d+)?)\b|\b(SELECT|FROM|WHERE|GROUP BY|ORDER BY|HAVING|LIMIT|OFFSET|LEFT JOIN|RIGHT JOIN|INNER JOIN|FULL JOIN|JOIN|ON|AND|OR|NOT|IN|IS|NULL|AS|DESC|ASC|DISTINCT|UNION ALL|UNION|INSERT INTO|VALUES|UPDATE|SET|DELETE|CREATE TABLE|CASE|WHEN|THEN|ELSE|END|LIKE|BETWEEN|EXISTS)\b|\b(COUNT|SUM|AVG|MAX|MIN|COALESCE|NOW)(?=\()/gi,
    (m,c,s,n,k,f)=>c?`<span class="c">${c}</span>`:s?`<span class="s">${s}</span>`:n?`<span class="n">${n}</span>`:k?`<span class="k">${k}</span>`:`<span class="f">${f}</span>`);
}
const hlPlain=l=>esc(l);

/* =====================================================================
   迷你编辑器（真实可编辑）：行号 + 高亮层 + 透明 textarea
   ===================================================================== */
function Editor(root,{value='',hl=hlPlain,readonly=false,onInput}={}){
  root.innerHTML=`<div class="ed"><div class="gut"></div><div class="code"><pre></pre><textarea spellcheck="false" ${readonly?'readonly':''}></textarea></div></div>`;
  const ed=$('.ed',root),gut=$('.gut',root),pre=$('pre',root),ta=$('textarea',root);
  const api={el:ed,ta,lineCls:{},gutter:null,
    get value(){return ta.value},
    set value(v){ta.value=v;draw()},
    setCls(map){api.lineCls=map||{};draw()},
    cur(){return ta.value.slice(0,ta.selectionStart).split('\n').length},
    pos(){const s=ta.value.slice(0,ta.selectionStart).split('\n');return {ln:s.length,col:s[s.length-1].length+1}},
    reveal(i){const y=i*20;ed.scrollTo({top:Math.max(0,y-ed.clientHeight/3),behavior:'smooth'})},
    flash(i){const el=pre.children[i];if(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}}};
  function draw(){
    const lines=ta.value.split('\n'),cur=api.cur();
    pre.innerHTML=lines.map((l,i)=>`<span class="l ${api.lineCls[i]||''}">${hl(l)||' '}</span>`).join('');
    gut.innerHTML=lines.map((_,i)=>`<div class="${i+1===cur?'cur ':''}${api.lineCls[i]==='del'?'gd':api.lineCls[i]==='add'?'ga':''}">${api.gutter?api.gutter(i):i+1}</div>`).join('');
    ta.style.height='auto';ta.style.height=Math.max(pre.offsetHeight,ed.clientHeight-16)+'px';
    ta.style.width=Math.max(pre.scrollWidth+4,ed.clientWidth-gut.offsetWidth-22)+'px';
  }
  ta.addEventListener('input',()=>{draw();onInput&&onInput(ta.value)});
  ['keyup','click','focus'].forEach(e=>ta.addEventListener(e,()=>{draw();api.onCursor&&api.onCursor(api.pos())}));

    if(u==='(')depth++;if(u===')')depth--;

    let tt=isKw&&sCaseV!=='keep'?(sCaseV==='upper'?t.toUpperCase():t.toLowerCase()):t;
    if(depth===0&&cl.includes(u)&&!(u==='JOIN'&&/^(LEFT|RIGHT|INNER|FULL)$/.test((toks[i-1]||'').toUpperCase()))){nl(0);clause=u;line+=tt+' ';continue}
    if(depth===0&&(u==='AND'||u==='OR')&&clause==='WHERE'){nl(1);line+=tt+' ';continue}
    if(t===','&&depth===0&&['SELECT','GROUP','ORDER'].includes(clause)){line=line.replace(/\s+$/,'')+',';nl(1);continue}
    if(t==='('||t===')'||t===','||t===';'){line=line.replace(/\s+$/,'')+t+((t===','||(t===')'&&!/^[,);]$/.test(toks[i+1]||'')))?' ':'');if(t===';')push();continue}
    if(toks[i-1]==='('){line+=tt;continue}
    line+=tt+' ';
  }
  push();return out.trim()}
const minifySQL=s=>s.replace(/--.*$/gm,'').replace(/\s+/g,' ').replace(/\s*([(),;=<>])\s*/g,'$1').trim();
function sqlRun(){
  const src=sInEd.value,m=sActSeg.get();let o='';
  if(m==='format')o=formatSQL(src);else if(m==='minify')o=minifySQL(src);
  else if(m==='escape')o=JSON.stringify(src).slice(1,-1);
  else try{o=JSON.parse('"'+src.replace(/"/g,'\\"').replace(/\\\\"/g,'\\"')+'"')}catch{o=src.replace(/\\n/g,'\n').replace(/\\"/g,'"')}
  sOutEd.value=o;
  $('#sOutTitle').textContent={format:'格式化结果',minify:'压缩结果',escape:'转义结果',unescape:'去转义结果'}[m];
  $('#sInStat').textContent=src.length+' 字符';$('#sOutStat').textContent=o.split('\n').length+' 行 · '+o.length+' 字符';
  const tbl=[...new Set([...src.matchAll(/\b(?:from|join|into|update)\s+([\w.]+)/gi)].map(x=>x[1]))];
  $('#sTables').innerHTML=tbl.map(t=>`<span class="badge" style="background:hsl(var(--primary)/.12);color:hsl(var(--primary))">${esc(t)}</span>`).join('');
  const st=(src.match(/;/g)||[]).length||1,jn=(src.match(/\bjoin\b/gi)||[]).length;
  const ok=src.trim().length>0&&(src.match(/\(/g)||[]).length===(src.match(/\)/g)||[]).length;
  $('#sStatus').classList.toggle('bad',!ok&&src.trim().length>0);
  $('#sStatus').innerHTML=(ok?`<span class="ok">${ic('check')}语法结构正常</span>`:`<span class="err">${ic('alert')}括号不匹配</span>`)+`<span>${st} 条语句</span><span>${tbl.length} 张表 · ${jn} 个 JOIN</span><span class="r"><span>${sDial}</span><span>${sCaseV==='upper'?'关键字大写':sCaseV==='lower'?'关键字小写':'保持原样'}</span><span>UTF-8</span></span>`;
}
const COPY=[['sql','纯 SQL'],['js','JavaScript 模板字符串'],['java','Java 文本块'],['go','Go 原始字符串'],['py','Python 三引号'],['php','PHP Heredoc']];
function asCode(k,s){const t=s;return {sql:t,js:'const sql = `\n'+t+'\n`;',java:'String sql = """\n'+t+'\n""";',go:'sql := `\n'+t+'\n`',py:'sql = """\n'+t+'\n"""',php:'$sql = <<<SQL\n'+t+'\nSQL;'}[k]}
